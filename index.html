<!DOCTYPE html>
<html lang="es">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kits de Derrame Mederi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: tablero operativo — resumen arriba, alertas, luego una ficha por kit con sus productos */
:root{
  /* Paleta institucional: blanco + naranja Mederi; semáforo (verde/ámbar/rojo) aparte del naranja */
  --bg:#ffffff; --surface:#ffffff; --tint:#fff4ee; --ink:#2a2420; --muted:#6f625a; --line:#f1d9cc;
  --accent:#ff671d; --accent-strong:#c9470a; --accent-ink:#ffffff;
  --ok:#1f7a4d; --ok-bg:#e5f4ec;
  --warn:#8a5a00; --warn-bg:#fff6d6; --warn-line:#e8b832;
  --bad:#b3261e; --bad-bg:#fde6e4;
  --font-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --font-body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.brand{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px;padding-bottom:14px;border-bottom:4px solid var(--accent)}
.brand img{display:block;height:auto}
.logo-mederi{width:clamp(150px,30vw,220px)}
.logo-quick{width:clamp(110px,22vw,160px);border-radius:6px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{color:var(--accent-strong);font-family:var(--font-display);font-weight:700;font-size:clamp(28px,5vw,40px);line-height:1;margin:4px 0 0;text-wrap:balance;letter-spacing:.01em}
.today{font-family:var(--font-mono);font-size:13px;color:var(--muted)}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;cursor:pointer;text-align:left;color:inherit;font:inherit}
.stat:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stat .n{font-family:var(--font-display);font-size:36px;font-weight:700;line-height:1}
.stat .l{font-size:13px;color:var(--muted)}
.stat.bad .n{color:var(--bad)} .stat.warn .n{color:var(--warn)} .stat.ok .n{color:var(--ok)}
.stat[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}

.alerts{background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:6px;padding:14px 16px}
.alerts.has-bad{background:var(--bad-bg);border-color:var(--bad)}
.alerts h2{font-family:var(--font-display);font-size:22px;margin:0 0 8px;letter-spacing:.02em}
.alerts ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.alerts li{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline}
.alerts li b{font-weight:700}
.alerts .none{color:var(--ok);font-weight:600}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent-strong);color:var(--accent-ink);border-color:var(--accent-strong)}

.kits{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,480px),1fr));gap:16px}
.kit{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden;min-width:0}
.kit-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 16px;background:var(--accent);color:var(--accent-ink)}
.kit-head .pill{background:var(--surface)}
.kit-head h3{font-family:var(--font-display);font-size:24px;margin:0;letter-spacing:.03em}
.kit-head .kh{display:flex;flex-direction:column;gap:0;min-width:0}
.kit-head .kname{font-weight:700;font-size:15px;line-height:1.2;overflow-wrap:anywhere}
.kitbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--tint)}
form.inline.kitbar{border-radius:0;border:0;border-bottom:1px solid var(--line);align-items:flex-end}
.kit-empty{margin:0;padding:16px;color:var(--muted)}
.rows{list-style:none;margin:0;padding:0}
.row{padding:7px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px;border-left:4px solid transparent}
.row:last-child{border-bottom:0}
.row.s-bad{border-left-color:var(--bad)} .row.s-warn{border-left-color:var(--warn-line)} .row.s-ok{border-left-color:transparent}
.row-main{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 12px;align-items:center;line-height:1.3}
.pname{font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:.02em}
.pdate{font-size:13px;color:var(--muted)}
.pill{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;justify-self:end}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.none{background:var(--tint);color:var(--muted)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)}
.actions{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.row .actions .btn{padding:3px 10px;font-size:12px}
.row .actions .btn.link{padding:3px 4px}
.btn{font:inherit;font-size:13px;font-weight:600;border-radius:5px;padding:6px 12px;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--ink)}
.btn.primary{background:var(--accent-strong);color:var(--accent-ink);border-color:var(--accent-strong)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.lock{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:6px;font-size:14px}
.lock.closed{background:var(--tint);border:1px solid var(--line);color:var(--ink)}
.lock.closed svg{color:var(--accent-strong);flex:none}
.lock.open{background:var(--ok-bg);color:var(--ok)}
.lock.open svg{flex:none}
.lock{flex-wrap:wrap}
.lock .grow{flex:1 1 260px;min-width:0}
form.auth{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;flex:1 1 300px;min-width:0}
form.auth .t{flex:1 1 100%;font-size:15px}
form.auth .msg{flex:1 1 100%;color:var(--bad);font-size:13px;font-weight:600;min-height:1em}
.exports{display:flex;flex-wrap:wrap;gap:8px}
.btn.excel{border-color:var(--accent-strong);color:var(--accent-strong);background:var(--surface)}
.btn.link{border:0;padding:6px 4px;color:var(--muted);text-decoration:underline}
.btn:disabled{opacity:.5;cursor:not-allowed}
form.inline{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;background:var(--tint);border:1px solid var(--line);border-radius:6px;padding:10px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);font-weight:600;min-width:0;flex:1 1 140px}
input,select{font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:6px 8px;min-width:0;width:100%}
.hist{font-size:13px;color:var(--muted);margin:0;padding-left:18px}
.hist li{margin:2px 0}
.add-kit{background:var(--tint);border:1px dashed var(--accent);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
fieldset.kitpick{border:0;margin:0;padding:0;flex:1 1 100%;min-width:0}
fieldset.kitpick legend{font-size:12px;color:var(--muted);font-weight:600;padding:0;margin-bottom:4px}
.kp-list{display:flex;flex-wrap:wrap;gap:6px}
.kp{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}
.kp:has(input:checked){border-color:var(--accent-strong);background:var(--accent-strong);color:var(--accent-ink)}
.kp input{accent-color:var(--accent-strong);margin:0;width:auto;flex:none}
.kp{white-space:nowrap;max-width:100%}
.kp.all{font-weight:700}
.add-kit h3{color:var(--accent-strong);font-family:var(--font-display);font-size:20px;margin:0}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:8px;padding:28px 20px;text-align:center;color:var(--muted)}
.note{font-size:13px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--accent-strong);color:var(--accent-ink);padding:9px 16px;border-radius:6px;font-size:14px;font-weight:600}
@media (max-width:520px){.summary{grid-template-columns:1fr 1fr 1fr}.stat .n{font-size:28px}.stat{padding:10px}}
@media (prefers-reduced-motion:no-preference){.row{transition:background .15s}}
</style>
</head>

  <header>
    <div>
      <div class="eyebrow">Mederi · Control de vencimientos</div>
      <h1>Kits para atención de derrames</h1>
    </div>
    <div class="today mono" id="today"></div>
  </header>

  <div id="lock" hidden></div>
  <section class="summary" aria-label="Resumen">
    <button class="stat bad" data-f="bad" aria-pressed="false"><span class="n mono" id="n-bad">–</span><span class="l">Vencidos</span></button>
    <button class="stat warn" data-f="warn" aria-pressed="false"><span class="n mono" id="n-warn">–</span><span class="l">Vencen en ≤ 60 días</span></button>
    <button class="stat ok" data-f="ok" aria-pressed="false"><span class="n mono" id="n-ok">–</span><span class="l">Vigentes</span></button>
  </section>

  <section class="alerts" id="alerts" aria-live="polite"><h2>Alertas</h2><p class="note">Cargando productos…</p></section>

  <div class="toolbar">
    <div class="chips" id="kitChips"></div>
    <div class="exports" id="exports" hidden>
      <button class="btn primary" id="btn-report" type="button">Exportar informe con gráficas (HTML)</button>
      <button class="btn excel" id="btn-xlsx" type="button">Exportar a Excel</button>
    </div>
  </div>
  <span class="note" id="who"></span>

  <section class="kits" id="kits"></section>

  <section class="add-kit" id="addBox" hidden>
    <h3>Agregar producto a uno o varios kits</h3>
    <form class="inline" id="addForm">
      <fieldset class="kitpick">
        <legend>Kits donde se carga el producto</legend>
        <div class="kp-list" id="add-kits"></div>
      </fieldset>
      <label class="f" style="flex:2 1 200px">Producto
        <input id="add-name" type="text" placeholder="Ej. Bolsa roja" required>
      </label>
      <label class="f">Fecha de vencimiento (opcional)
        <input id="add-date" type="date">
      </label>
      <button class="btn primary" type="submit">Agregar</button>
    </form>
  </section>

  <section class="add-kit" id="newKitBox" hidden>
    <h3>Crear un kit nuevo</h3>
    <form class="inline" id="newKitForm">
      <label class="f" style="flex:0 1 120px">Número
        <input id="nk-num" type="number" min="1" step="1" required>
      </label>
      <label class="f" style="flex:2 1 220px">Nombre del kit
        <input id="nk-name" type="text" placeholder="Ej. Urgencias piso 3">
      </label>
      <button class="btn primary" type="submit">Crear kit</button>
    </form>
  </section>
</div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const WARN_DAYS = 60;
const MESES = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
let items = [];          // {id, kit, producto, vence, historial[]}
let addKits = new Set();
let kitsMeta = {};       // {numero: {nombre}}  colección "kits", doc "k<numero>"
function kitName(k){ return (kitsMeta[k]?.nombre||"").trim(); }
function kitLabel(k){ const n=kitName(k); return n?`Kit #${k} · ${n}`:`Kit #${k}`; }
function allKits(){ return [...new Set(items.map(i=>i.kit).concat(Object.keys(kitsMeta).map(Number)))].filter(n=>n>0).sort((a,b)=>a-b); }
let db = null, canWrite = false, loaded = false;
let statusFilter = null, kitFilter = "all";
let openForm = null, openHist = new Set();

function todayLocal(){ const d=new Date(); return new Date(d.getFullYear(),d.getMonth(),d.getDate()); }
function parseD(s){ const [y,m,d]=String(s).split("-").map(Number); return new Date(y,m-1,d); }
function fmt(s){ if(!s) return "—"; const d=parseD(s); return `${String(d.getDate()).padStart(2,"0")} ${MESES[d.getMonth()]} ${d.getFullYear()}`; }
function daysLeft(s){ if(!s) return ""; return Math.round((parseD(s)-todayLocal())/86400000); }
function status(s){ if(!s) return "none"; const n=daysLeft(s); return n<0?"bad":(n<=WARN_DAYS?"warn":"ok"); }
function label(s){
  if(!s) return "Sin fecha";
  const n=daysLeft(s);
  if(n<0) return `Vencido hace ${-n} ${-n===1?"día":"días"}`;
  if(n===0) return "Vence hoy";
  return `${n} ${n===1?"día":"días"}`;
}
function esc(t){ return String(t??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,2600); }

document.getElementById("today").textContent = "Hoy: " + fmt(isoToday()) + " · alerta a " + WARN_DAYS + " días";

function render(){
  const valid = items.filter(i=>i.vence);
  const c={bad:0,warn:0,ok:0}; valid.forEach(i=>c[status(i.vence)]++);
  for(const k in c) document.getElementById("n-"+k).textContent = loaded?c[k]:"–";
  document.querySelectorAll(".stat").forEach(b=>b.setAttribute("aria-pressed", String(statusFilter===b.dataset.f)));

  // Alertas
  const al=document.getElementById("alerts");
  const urgent = valid.filter(i=>status(i.vence)!=="ok").sort((a,b)=>a.vence.localeCompare(b.vence)||a.kit-b.kit);
  al.classList.toggle("has-bad", urgent.some(i=>status(i.vence)==="bad"));
  if(!loaded){ /* keep loading text */ }
  else if(!urgent.length){ al.innerHTML = `<h2>Alertas</h2><p class="none">Ningún producto vence en los próximos ${WARN_DAYS} días.</p>`; }
  else {
    al.innerHTML = `<h2>Alertas · ${urgent.length} ${urgent.length===1?"producto requiere":"productos requieren"} reposición</h2><ul>` +
      urgent.map(i=>`<li><span class="pill ${status(i.vence)}">${label(i.vence)}</span><b>${esc(kitLabel(i.kit))} · ${esc(i.producto)}</b><span class="mono pdate">vence ${fmt(i.vence)}</span></li>`).join("") + `</ul>`;
  }

  // Chips de kit
  const kits=allKits();
  document.getElementById("kitChips").innerHTML =
    [`<button class="chip" data-k="all" aria-pressed="${kitFilter==="all"}">Todos los kits</button>`]
    .concat(kits.map(k=>`<button class="chip" data-k="${k}" aria-pressed="${String(kitFilter)===String(k)}">${esc(kitLabel(k))}</button>`)).join("");

  // Formularios de kit
  for(const k of [...addKits]) if(!kits.includes(k)) addKits.delete(k);
  const allOn = kits.length>0 && kits.every(k=>addKits.has(k));
  document.getElementById("add-kits").innerHTML =
    `<label class="kp all"><input type="checkbox" id="kp-all" ${allOn?"checked":""}> Todos los kits</label>` +
    kits.map(k=>`<label class="kp"><input type="checkbox" id="kp-${k}" data-kp="${k}" ${addKits.has(k)?"checked":""}> ${esc(kitLabel(k))}</label>`).join("");
  const nk=document.getElementById("nk-num"), nextNum=(kits.length?Math.max(...kits):0)+1;
  if(!nk.value || kits.includes(Number(nk.value))) nk.value=nextNum;
  document.getElementById("newKitBox").hidden=!canWrite;

  // Kits
  const box=document.getElementById("kits");
  if(!loaded){ box.innerHTML=`<div class="empty">Cargando los kits…</div>`; return; }
  if(!kits.length){ box.innerHTML=`<div class="empty">Aún no hay productos registrados. ${canWrite?"Agrega el primero en el formulario de abajo.":""}</div>`; return; }
  const show = kits.filter(k=>kitFilter==="all"||String(k)===String(kitFilter));
  box.innerHTML = show.map(k=>{
    let rows = items.filter(i=>i.kit===k).sort((a,b)=>(a.orden??99)-(b.orden??99)||a.producto.localeCompare(b.producto));
    const all = rows;
    if(statusFilter) rows = rows.filter(i=>i.vence && status(i.vence)===statusFilter);
    if(!rows.length && (statusFilter || all.length)) return "";
    const worst = !all.length?"none":all.some(i=>status(i.vence)==="bad")?"bad":all.some(i=>status(i.vence)==="warn")?"warn":"ok";
    const worstTxt={bad:"Con productos vencidos",warn:"Reposición próxima",ok:"Todo vigente",none:"Sin productos"}[worst];
    const nm=kitName(k);
    let head=`<div class="kit-head"><div class="kh"><h3>KIT #${k}</h3><span class="kname">${nm?esc(nm):"Sin nombre"}</span></div><span class="pill ${worst==="none"?"ok":worst}">${worstTxt}</span></div>`;
    let tools="";
    if(canWrite){
      if(openForm==="name:"+k){
        tools=`<form class="inline kitbar" data-kitname="${k}"><label class="f" style="flex:2 1 220px">Nombre del kit<input id="kn-${k}" type="text" value="${esc(nm)}" placeholder="Ej. Jaime Oviedo" required></label>
          <button class="btn primary" type="submit">Guardar nombre</button><button class="btn" type="button" data-cancel>Cancelar</button></form>`;
      } else if(openForm==="delkit:"+k){
        tools=`<div class="kitbar confirm"><span>¿Quitar el <b>${esc(kitLabel(k))}</b>?</span><button class="btn danger" data-delkitok="${k}">Sí, quitar kit</button><button class="btn" data-cancel>Cancelar</button></div>`;
      } else {
        tools=`<div class="kitbar"><button class="btn" data-kname="${k}">${nm?"Cambiar nombre":"Agregar nombre"}</button>
          ${nm?`<button class="btn link" data-knamedel="${k}">Eliminar nombre</button>`:""}
          ${!all.length?`<button class="btn link" data-delkit="${k}">Quitar kit</button>`:""}</div>`;
      }
    }
    const body = all.length ? `<ul class="rows">${rows.map(rowHtml).join("")}</ul>` : `<p class="kit-empty">Este kit aún no tiene productos.${canWrite?" Agrégalos en “Agregar producto a un kit”.":""}</p>`;
    return `<article class="kit">${head}${tools}${body}</article>`;
  }).join("") || `<div class="empty">No hay productos en este filtro.</div>`;
}

function rowHtml(i){
  const s=status(i.vence);
  const hist=(i.historial||[]);
  let h=`<li class="row s-${s}" data-id="${esc(i.id)}">
    <div class="row-main">
      <span class="pname">${esc(i.producto)}</span>
      <span class="pill ${s}">${label(i.vence)}</span>
      <span class="pdate">${i.vence?`Vence <span class="mono">${fmt(i.vence)}</span>`:"Sin fecha de vencimiento"}</span>
    </div>`;
  if(openForm===i.id){
    h+=`<form class="inline" data-repo="${esc(i.id)}">
      <label class="f">Nueva fecha de vencimiento<input id="nd-${esc(i.id)}" type="date" required></label>
      <label class="f" style="flex:2 1 180px">Nota (opcional)<input id="nn-${esc(i.id)}" type="text" placeholder="Ej. Reposición recibida de almacén"></label>
      <button class="btn primary" type="submit">Guardar reposición</button>
      <button class="btn" type="button" data-cancel>Cancelar</button>
    </form>`;
  } else if(openForm==="del:"+i.id){
    h+=`<div class="inline" style="display:flex;flex-wrap:wrap;gap:8px;align-items:center"><span>¿Quitar <b>${esc(i.producto)}</b> del ${esc(kitLabel(i.kit))}?</span>
      <button class="btn danger" data-delok="${esc(i.id)}">Sí, quitar</button><button class="btn" data-cancel>Cancelar</button></div>`;
  } else {
    h+=`<div class="actions">
      ${canWrite?`<button class="btn primary" data-open="${esc(i.id)}">${i.vence?"Registrar reposición":"Agregar fecha"}</button>`:""}
      ${hist.length?`<button class="btn link" data-hist="${esc(i.id)}">${openHist.has(i.id)?"Ocultar":"Ver"} historial (${hist.length})</button>`:""}
      ${canWrite?`<button class="btn link" data-del="${esc(i.id)}">Quitar</button>`:""}
    </div>`;
  }
  if(openHist.has(i.id) && hist.length){
    h+=`<ul class="hist">${hist.slice().reverse().map(x=>`<li>Vencía <span class="mono">${fmt(x.vence)}</span> → repuesto el <span class="mono">${fmt(x.repuesto)}</span>${x.nota?` · ${esc(x.nota)}`:""}</li>`).join("")}</ul>`;
  }
  return h+`</li>`;
}

function isoToday(){ const d=todayLocal(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }

document.addEventListener("click", async e=>{
  const t=e.target.closest("button"); if(!t) return;
  if(t.classList.contains("stat")){ statusFilter = statusFilter===t.dataset.f?null:t.dataset.f; render(); return; }
  if(t.dataset.k){ kitFilter=t.dataset.k; render(); return; }
  if(t.dataset.open){ openForm=t.dataset.open; render(); document.getElementById("nd-"+openForm)?.focus(); return; }
  if(t.dataset.del){ openForm="del:"+t.dataset.del; render(); return; }
  if(t.dataset.kname){ openForm="name:"+t.dataset.kname; render(); document.getElementById("kn-"+t.dataset.kname)?.focus(); return; }
  if(t.dataset.delkit){ openForm="delkit:"+t.dataset.delkit; render(); return; }
  if(t.dataset.knamedel){
    const k=Number(t.dataset.knamedel); t.disabled=true;
    try{ await db.collection("kits").doc("k"+k).set({numero:k, nombre:""}); toast(`Nombre eliminado del Kit #${k}`); }
    catch(err){ handleErr(err); t.disabled=false; } return;
  }
  if(t.dataset.delkitok){
    const k=Number(t.dataset.delkitok);
    if(items.some(i=>i.kit===k)){ toast("Primero quita los productos de este kit"); openForm=null; render(); return; }
    t.disabled=true;
    try{ await db.collection("kits").doc("k"+k).delete(); openForm=null; if(String(kitFilter)===String(k)) kitFilter="all"; toast(`Kit #${k} quitado`); }
    catch(err){ handleErr(err); t.disabled=false; } return;
  }
  if(t.hasAttribute("data-cancel")){ e.preventDefault(); openForm=null; render(); return; }
  if(t.dataset.hist){ const id=t.dataset.hist; openHist.has(id)?openHist.delete(id):openHist.add(id); render(); return; }
  if(t.dataset.delok){
    const id=t.dataset.delok; t.disabled=true;
    try{ await db.collection("productos").doc(id).delete(); openForm=null; toast("Producto quitado"); }
    catch(err){ handleErr(err); t.disabled=false; }
  }
});

document.addEventListener("submit", async e=>{
  e.preventDefault();
  const f=e.target;
  if(f.dataset.repo){
    const id=f.dataset.repo, it=items.find(x=>x.id===id); if(!it||!db) return;
    const nd=document.getElementById("nd-"+id).value, nn=document.getElementById("nn-"+id).value.trim();
    if(!nd) return;
    const btn=f.querySelector("button[type=submit]"); btn.disabled=true;
    const historial=it.vence ? (it.historial||[]).concat([{vence:it.vence, repuesto:isoToday(), nota:nn}]).slice(-30) : (it.historial||[]);
    try{
      await db.collection("productos").doc(id).update({vence:nd, historial, actualizado:new Date().toISOString()});
      openForm=null; toast(`Reposición guardada: vence ${fmt(nd)}`);
    }catch(err){ handleErr(err); btn.disabled=false; }
  }
  if(f.dataset.kitname){
    const k=Number(f.dataset.kitname), nombre=document.getElementById("kn-"+k).value.trim();
    if(!nombre||!db) return;
    const btn=f.querySelector("button[type=submit]"); btn.disabled=true;
    try{ await db.collection("kits").doc("k"+k).set({numero:k, nombre}); openForm=null; toast(`Kit #${k}: ${nombre}`); }
    catch(err){ handleErr(err); btn.disabled=false; }
    return;
  }
  if(f.id==="newKitForm"){
    if(!db) return;
    const k=parseInt(document.getElementById("nk-num").value,10), nombre=document.getElementById("nk-name").value.trim();
    if(!k||k<1) return;
    if(allKits().includes(k)){ toast(`Ya existe el Kit #${k}`); return; }
    try{ await db.collection("kits").doc("k"+k).set({numero:k, nombre}); f.reset(); toast(`Kit #${k} creado`); kitFilter="all"; render(); }
    catch(err){ handleErr(err); }
    return;
  }
  if(f.id==="addForm"){
    if(!db) return;
    const producto=document.getElementById("add-name").value.trim().toUpperCase(),
      vence=document.getElementById("add-date").value, sel=[...addKits].sort((a,b)=>a-b);
    if(!producto) return;
    if(!sel.length){ toast("Selecciona al menos un kit"); return; }
    const btn=f.querySelector("button[type=submit]"); btn.disabled=true;
    let ok=0;
    try{
      for(const kit of sel){
        await db.collection("productos").add({kit, producto, vence, historial:[], orden:99, actualizado:new Date().toISOString()});
        ok++;
      }
      document.getElementById("add-name").value=""; document.getElementById("add-date").value="";
      toast(sel.length===1 ? `${producto} agregado al ${kitLabel(sel[0])}` : `${producto} agregado a ${sel.length} kits`);
    }catch(err){ if(ok) toast(`Se agregó a ${ok} de ${sel.length} kits. Revisa los que faltan.`); else handleErr(err); }
    finally{ btn.disabled=false; }
  }
});

document.getElementById("add-kits").addEventListener("change",e=>{

const ESTADO = {bad:"Vencido", warn:"Por vencer (≤ 60 días)", ok:"Vigente", none:"Sin fecha"};
function stamp(){ return isoToday(); }
function sortedItems(){ return items.slice().sort((a,b)=>a.kit-b.kit||(a.orden??99)-(b.orden??99)||a.producto.localeCompare(b.producto)); }
function lastRepo(i){ const h=i.historial||[]; return h.length?h[h.length-1].repuesto:""; }

// Agrupa por nombre de producto (en todos los kits)
function byProduct(){
  const m={};
  for(const i of sortedItems()){
    const k=i.producto; m[k] ??= {producto:k, bad:0, warn:0, ok:0, none:0, repos:0};
    m[k][status(i.vence)]++; m[k].repos += (i.historial||[]).length;
  }
  return Object.values(m);
}

function barsSVG(rows, series, colors, labels){
  // rows: [{name, values:[..]}]  barras horizontales apiladas
  const W=720, left=230, right=40, rowH=34, top=34, bottom=30;
  const max=Math.max(1,...rows.map(r=>r.values.reduce((a,b)=>a+b,0)));
  const step = max<=10?1:Math.ceil(max/8);
  const ticks=[]; for(let t=0;t<=max;t+=step) ticks.push(t);
  const plotW=W-left-right, H=top+rows.length*rowH+bottom;
  const x=v=>left+v/ (ticks[ticks.length-1]||1) *plotW;
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" style="max-width:${W}px;font-family:Arial,sans-serif;font-size:12px">`;
  // leyenda
  let lx=left; series.forEach((k,j)=>{ s+=`<rect x="${lx}" y="6" width="12" height="12" rx="2" fill="${colors[j]}"/><text x="${lx+17}" y="16" fill="#2a2420">${labels[j]}</text>`; lx+=labels[j].length*7+40; });
  ticks.forEach(t=>{ s+=`<line x1="${x(t)}" x2="${x(t)}" y1="${top-4}" y2="${H-bottom}" stroke="#eee3dc"/><text x="${x(t)}" y="${H-bottom+16}" text-anchor="middle" fill="#6f625a">${t}</text>`; });
  rows.forEach((r,i)=>{
    const y=top+i*rowH+6; let acc=0;
    s+=`<text x="${left-10}" y="${y+15}" text-anchor="end" fill="#2a2420" font-weight="bold">${esc(r.name)}</text>`;
    r.values.forEach((v,j)=>{ if(!v) return; const x0=x(acc), x1=x(acc+v); s+=`<rect x="${x0}" y="${y}" width="${Math.max(1,x1-x0-1)}" height="22" rx="3" fill="${colors[j]}"/>`; if(x1-x0>18) s+=`<text x="${(x0+x1)/2}" y="${y+15}" text-anchor="middle" fill="#fff" font-weight="bold">${v}</text>`; acc+=v; });
    const tot=r.values.reduce((a,b)=>a+b,0); s+=`<text x="${x(acc)+6}" y="${y+15}" fill="#6f625a">${tot}</text>`;
  });
  return s+`</svg>`;
}

function toDate(s){ return s?parseD(s):""; }
function buildXlsx(){
  const list=sortedItems();
  const inv=[["Kit","Nombre del kit","Producto","Fecha de vencimiento","Días restantes","Estado","Reposiciones registradas","Última reposición"]]
    .concat(list.map(i=>[i.kit, kitName(i.kit), i.producto, toDate(i.vence), daysLeft(i.vence), ESTADO[status(i.vence)], (i.historial||[]).length, toDate(lastRepo(i))]));
  const hist=[["Fecha de reposición","Kit","Nombre del kit","Producto","Fecha que vencía","Nota"]];
  list.forEach(i=>(i.historial||[]).forEach(h=>hist.push([toDate(h.repuesto), i.kit, kitName(i.kit), i.producto, toDate(h.vence), h.nota||""])));
  const sol=[["Producto","Reposiciones registradas","Vencidos","Por vencer (≤ 60 días)","Vigentes"]]
    .concat(byProduct().sort((a,b)=>b.repos-a.repos).map(p=>[p.producto,p.repos,p.bad,p.warn,p.ok]));
  const wb=XLSX.utils.book_new();
  const add=(rows,name,cols)=>{ const ws=XLSX.utils.aoa_to_sheet(rows,{cellDates:true,dateNF:"dd/mm/yyyy"}); ws["!cols"]=cols.map(w=>({wch:w})); ws["!autofilter"]={ref:ws["!ref"]}; XLSX.utils.book_append_sheet(wb,ws,name); };
  add(inv,"Inventario",[8,24,28,20,15,24,24,18]);
  add(sol,"Más solicitados",[28,24,10,22,10]);
  add(hist,"Historial",[20,8,24,28,18,40]);
  return XLSX.write(wb,{bookType:"xlsx",type:"array",cellDates:true});
}

async function doSave(filename, makeData, btn){
  if(!downloads) return;
  if(!items.length){ toast("No hay productos para exportar"); return; }
  btn.disabled=true;
  try{ const r=await downloads.save({filename, data:makeData()}); if(r?.status==="saved") toast("Archivo descargado"); }
  catch(err){ if(err?.code==="declined"){} else if(err?.code==="rate_limited") toast("Ya hay una descarga pendiente"); else toast("No se pudo exportar el archivo"); }

const ICON_LOCK=`<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M17 9h-1V7a4 4 0 0 0-8 0v2H7a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2Zm-7-2a2 2 0 0 1 4 0v2h-4Z"/></svg>`;
const ICON_OPEN=`<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M17 9h-1V7a4 4 0 0 0-7.9-.9l1.9.6A2 2 0 0 1 14 7v2H7a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2Z"/></svg>`;

function server(fn,...args){
  return new Promise((resolve,reject)=>{
    if(!window.google?.script?.run){ reject({code:"unavailable",message:"Sin conexión con Google"}); return; }
    google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>{
      const m=String(e?.message||e);
      if(m.includes("SESION")){ auth.token=null; auth.email=null; saveSession(); applyAuth(); reject({code:"session",message:"Tu sesión terminó. Ingresa de nuevo."}); }
      else reject({code:"error",message:m.replace(/^Error:\s*/,"")});
    })[fn](...args);
  });
}

// Mismo formato que usaba la página en Claude, ahora contra la hoja de cálculo
db = {
  collection(col){
    return {
      doc(id){ return {
        set:   d=>server("guardar",auth.token,col,id,d).then(cargar),
        update:d=>server("actualizar",auth.token,col,id,d).then(cargar),
        delete:()=>server("borrar",auth.token,col,id).then(cargar)
      }; },
      add: d=>server("guardar",auth.token,col,null,d).then(cargar)
    };
  }
};

let cargando=false;
async function cargar(){
  if(cargando) return; cargando=true;
  try{
    const d=await server("obtenerDatos");
    items=(d.productos||[]).map(p=>({...p, historial:p.historial||[]}));
    const m={}; (d.kits||[]).forEach(k=>{ if(k.numero) m[k.numero]={nombre:k.nombre||""}; }); kitsMeta=m;
    loaded=true; render();
  }catch(e){ if(!loaded){ loaded=true; render(); } toast("No se pudieron cargar los datos. Revisa tu conexión."); }
  finally{ cargando=false; }
}

function saveSession(){ try{ auth.token ? sessionStorage.setItem("kits-sesion",JSON.stringify({t:auth.token,e:auth.email})) : sessionStorage.removeItem("kits-sesion"); }catch(e){} }

function applyAuth(){
  canWrite = !!auth.token;
  document.getElementById("addBox").hidden = !canWrite;
  document.getElementById("newKitBox").hidden = !canWrite;
  if(!canWrite) openForm=null;
  const lk=document.getElementById("lock"); lk.hidden=false;
  let html="", cls="closed";
  if(canWrite){
    cls="open";
    html=`${ICON_OPEN}<span class="grow"><b>Sesión iniciada</b> como <span class="mono">${esc(auth.email)}</span>. Puedes registrar reposiciones, agregar y quitar productos.</span>
      <button class="btn" type="button" data-auth="logout">Cerrar sesión</button>`;
  } else if(auth.mode==="login"){
    html=`${ICON_LOCK}<form class="auth" id="loginForm" autocomplete="on">
      <b class="t">Ingreso de usuario autorizado</b>
      <label class="f">Correo<input id="login-email" type="email" autocomplete="username" required></label>
      <label class="f">Contraseña<input id="login-pass" type="password" autocomplete="current-password" required></label>
      <button class="btn primary" type="submit">Ingresar</button><button class="btn" type="button" data-auth="cancel">Cancelar</button>
      <span class="msg" id="auth-msg" role="alert"></span></form>`;
  } else {
    html=`${ICON_LOCK}<span class="grow"><b>Edición bloqueada.</b> Puedes consultar y exportar. Para registrar cambios ingresa con correo y contraseña.</span>
      <button class="btn primary" type="button" data-auth="login">Ingresar</button>`;
  }
  lk.className="lock "+cls; lk.innerHTML=html;
  render();
  const first=lk.querySelector("input"); if(first && !first.value) first.focus();
}

document.getElementById("lock").addEventListener("click",e=>{
  const b=e.target.closest("[data-auth]"); if(!b) return;
  const a=b.dataset.auth;
  if(a==="login") auth.mode="login";
  if(a==="cancel") auth.mode=null;
  if(a==="logout"){ server("salir",auth.token).catch(()=>{}); auth.token=null; auth.email=null; auth.mode=null; saveSession(); toast("Sesión cerrada"); }
  applyAuth();
});

document.getElementById("lock").addEventListener("submit",async e=>{
  e.preventDefault();
  if(e.target.id!=="loginForm") return;
  const msg=document.getElementById("auth-msg"), btn=e.target.querySelector("button[type=submit]");
  const email=document.getElementById("login-email").value, pass=document.getElementById("login-pass").value;
  btn.disabled=true; msg.textContent="Verificando…";
  try{
    const r=await server("ingresar",email,pass);
    auth.token=r.token; auth.email=r.email; auth.mode=null; saveSession(); toast("Sesión iniciada"); applyAuth();
  }catch(err){
    btn.disabled=false; msg.textContent=err.message||"No se pudo ingresar.";
    document.getElementById("login-pass").value="";
  }
});

render();
(function(){
  downloads = { save: async ({filename,data})=>{
    const blob = data instanceof Blob ? data : new Blob([data], {type: filename.endsWith(".xlsx") ? "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" : "text/html;charset=utf-8"});
    const url=URL.createObjectURL(blob), a=document.createElement("a");
    a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);
    return {status:"saved"};
  }};
  document.getElementById("exports").hidden=false;
  try{ const s=JSON.parse(sessionStorage.getItem("kits-sesion")||"null"); if(s&&s.t){ auth.token=s.t; auth.email=s.e; } }catch(e){}
  applyAuth();
  cargar();
  // En línea: se actualiza cada 30 segundos y al volver a la pestaña
  setInterval(()=>{ if(!document.hidden) cargar(); }, 30000);
  document.addEventListener("visibilitychange",()=>{ if(!document.hidden) cargar(); });
})();
</script>
